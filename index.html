<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet"
  >
  <link
    rel="icon"
    type="image/x-icon"
    href="/favicon.ico"
  >
  <title>Coffee House</title>
</head>
<body>
<!--Replaced header-container with header.js-->
<header id="header-container"></header>

<main class="main">
  <section class="hero">
    <div class="container">
      <div class="hero__background-image">
        <div class="hero__wrapper">
          <h1 class="hero__header">
            <span class="hero__header_accent">Enjoy</span>
            premium
            coffee at our
            charming cafe
          </h1>
          <p class="hero__info">With its inviting atmosphere and delicious
            coffee
            options, the
            Coffee House Resource is a popular destination for coffee lovers and
            those seeking a warm and inviting space to enjoy their favorite
            beverage.
          </p>
          <button
            class="hero__button"
            type="button"
          >
            Menu
          </button>
        </div>
      </div>
    </div>
  </section>
</main>
<footer id="footer-container">

</footer>
<script
  type="module"
  src="./src/index.js"
></script>
</body>
</html>
